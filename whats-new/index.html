<!DOCTYPE html>
<!-- What's New: an in-app web view that shows a pre-generated overview of everything a
     user gains by updating, chosen by the #version_<key> hash the app passes in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" content="#A32E22">
<meta name="robots" content="noindex">
<title>What's new &middot; Sojourn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EA; --paper-2:#EFE8DA; --ink:#221B12; --ink-2:#42392B;
    --faint:#8E8471; --line:#DFD6C3; --rubric:#A32E22; --rubric-soft:#C9584B;
    --wash:#F3E3B5;
    --serif:'EB Garamond',Georgia,'Times New Roman',serif;
    --sans:'Instrument Sans',-apple-system,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  ::selection{background:var(--wash);}

  .wrap{
    max-width:600px;margin:0 auto;
    padding:calc(34px + env(safe-area-inset-top)) 26px calc(40px + env(safe-area-inset-bottom));
  }

  .eyebrow{
    font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--rubric);margin-bottom:14px;
  }
  h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(30px,7.5vw,40px);
    line-height:1.08;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty;
  }
  .intro{
    font-size:19px;line-height:1.6;color:var(--ink-2);margin-top:18px;
    padding-bottom:26px;border-bottom:1px solid var(--line);
  }

  .items{list-style:none;margin-top:8px;}
  .item{padding:22px 0;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:0;}
  .item h2{
    font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.005em;
    color:var(--ink);margin-bottom:6px;
  }
  .item p{font-size:18px;line-height:1.55;color:var(--ink-2);}

  /* up-to-date / fallback state */
  .rest{padding-top:12px;}
  .rest h1{margin-bottom:16px;}
  .rest p{font-size:19px;line-height:1.6;color:var(--ink-2);}

  .mark{
    display:block;margin-top:44px;font-family:var(--serif);font-weight:600;
    font-size:17px;color:var(--faint);letter-spacing:.01em;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#17130D; --paper-2:#221B12; --ink:#F3ECDD; --ink-2:#D8CDB8;
      --faint:#9A8F79; --line:#332A1D; --rubric:#E0806F; --rubric-soft:#C9584B;
      --wash:#3a3116;
    }
  }
</style>
</head>
<body>
  <main class="wrap" id="app"></main>

  <!-- WHATS-NEW-DATA:START — regenerated by the whats-new skill from releases.json. Do not hand-edit. -->
  <script id="whats-new-data" type="application/json">
  {
    "latest": "5",
    "updates": {
      "2": {
        "since": "version 2",
        "intro": "Quite a bit has landed since you last updated. Here's what's waiting for you when you open the new version.",
        "items": [
          { "title": "New topics: grief and anxiety", "text": "Two more places to bring what you're carrying and sit with what scripture says about it." },
          { "title": "A verse each day", "text": "The home screen now opens with a single verse to start from." },
          { "title": "Search that finds it", "text": "Look across the whole text and land on the passage you meant." },
          { "title": "A prompt to begin", "text": "When you don't know where to start, a gentle question opens the conversation for you." },
          { "title": "Keep a verse", "text": "Bookmark anything that stays with you and find it again later." },
          { "title": "Share a passage", "text": "Turn a verse into an image worth sending to someone." },
          { "title": "Study arcs", "text": "Every topic now walks you through it in order, from the first question to where scripture lands." },
          { "title": "A quicker reader", "text": "Chapters open and scroll more smoothly, so nothing sits between you and the text." }
        ]
      },
      "3": {
        "since": "version 3",
        "intro": "A few good things have landed since your last update.",
        "items": [
          { "title": "A prompt to begin", "text": "When you don't know where to start, a gentle question opens the conversation for you." },
          { "title": "Keep a verse", "text": "Bookmark anything that stays with you and find it again later." },
          { "title": "Share a passage", "text": "Turn a verse into an image worth sending to someone." },
          { "title": "Study arcs", "text": "Every topic now walks you through it in order, from the first question to where scripture lands." },
          { "title": "A quicker reader", "text": "Chapters open and scroll more smoothly, so nothing sits between you and the text." }
        ]
      },
      "4": {
        "since": "version 4",
        "intro": "A small update, but a welcome one.",
        "items": [
          { "title": "Study arcs", "text": "Every topic now walks you through it in order, from the first question to where scripture lands." },
          { "title": "A quicker reader", "text": "Chapters open and scroll more smoothly, and a round of small fixes smooths out the rest." }
        ]
      }
    }
  }
  </script>
  <!-- WHATS-NEW-DATA:END -->

  <script>
    // Read the version the app passed in (#version_<key>) and show its pre-generated overview.
    (function () {
      var data = JSON.parse(document.getElementById('whats-new-data').textContent);
      var app = document.getElementById('app');

      function versionKey() {
        var h = (location.hash || '').replace(/^#/, '');
        var m = h.match(/^version[_-](.+)$/i);
        return m ? m[1] : null;
      }

      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderUpdate(u) {
        var items = u.items.map(function (it) {
          return '<li class="item"><h2>' + esc(it.title) + '</h2><p>' + esc(it.text) + '</p></li>';
        }).join('');
        return '<p class="eyebrow">What’s new in Sojourn</p>' +
               '<h1>Since you last updated</h1>' +
               '<p class="intro">' + esc(u.intro) + '</p>' +
               '<ul class="items">' + items + '</ul>' +
               '<span class="mark">Sojourn</span>';
      }

      function renderUpToDate() {
        return '<div class="rest">' +
               '<p class="eyebrow">What’s new in Sojourn</p>' +
               '<h1>You’re all caught up</h1>' +
               '<p>You’re on the latest version. Nothing to catch up on. Thanks for reading with us.</p>' +
               '<span class="mark">Sojourn</span>' +
               '</div>';
      }

      function render() {
        var key = versionKey();
        var u = key && data.updates[key];
        app.innerHTML = u ? renderUpdate(u) : renderUpToDate();
        window.scrollTo(0, 0);
      }

      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
</body>
</html>
